name: Build Windows test package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - shell: pwsh
        run: |
          dotnet publish src/AnimeAudioCaptioner/AnimeAudioCaptioner.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
          Compress-Archive -Path publish\* -DestinationPath payload.zip
          @'
          @echo off
          setlocal
          set "TARGET=%LOCALAPPDATA%\AnimeAudioCaptioner"
          if not exist "%TARGET%" mkdir "%TARGET%"
          tar.exe -xf "%~dp0payload.zip" -C "%TARGET%"
          start "" "%TARGET%\AnimeAudioCaptioner.exe"
          '@ | Set-Content -Encoding ASCII launch.cmd
          @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3

          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=1
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=$env:GITHUB_WORKSPACE\AnimeAudioCaptioner.exe
          FriendlyName=Anime Audio Captioner
          AppLaunched=launch.cmd
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles

          [Strings]
          FILE0="payload.zip"
          FILE1="launch.cmd"

          [SourceFiles]
          SourceFiles0=.

          [SourceFiles0]
          %FILE0%=
          %FILE1%=
          "@ | Set-Content -Encoding ASCII package.sed
          & "$env:WINDIR\System32\iexpress.exe" /N package.sed
          if (!(Test-Path AnimeAudioCaptioner.exe)) { throw "Portable EXE was not created." }
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeAudioCaptioner-single-portable-exe
          path: AnimeAudioCaptioner.exe
