name: Build Windows test package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - shell: pwsh
        run: |
          dotnet publish src/AnimeAudioCaptioner/AnimeAudioCaptioner.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
          Compress-Archive -Path publish\* -DestinationPath AnimeAudioCaptioner-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeAudioCaptioner-win-x64-test
          path: AnimeAudioCaptioner-win-x64.zip
